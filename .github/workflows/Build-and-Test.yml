name: CI (PR to develop/main)

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Locate solution
        shell: bash
        run: |
          set -euo pipefail
          SLN=$(find . -maxdepth 5 -name "*.sln" -print -quit)
          if [ -z "${SLN}" ]; then
            echo "No .sln found under repo root."
            exit 1
          fi
          echo "SLN=${SLN}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore "${{ env.SLN }}"

      - name: Build
        run: dotnet build "${{ env.SLN }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ env.SLN }}" --configuration Release --no-build --verbosity normal
